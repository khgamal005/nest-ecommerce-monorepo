events {}

http {
  # Main domain -> storefront (user-ui)
  server {
    listen 80;
    server_name shop.example.com;

    location /api/ {
      proxy_pass http://backend:3333/api/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://user-ui:3000;
      proxy_set_header Host $host;
    }
  }

  # Subdomain -> admin dashboard (all admin responsibilities)
  server {
    listen 80;
    server_name admin.shop.example.com;

    location /api/ {
      proxy_pass http://backend:3333/api/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://admin-ui:3001;
      proxy_set_header Host $host;
    }
  }
}
