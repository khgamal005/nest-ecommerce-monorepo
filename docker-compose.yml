version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: apps/backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - '3333:3333'

  user-ui:
    build:
      context: .
      dockerfile: apps/user-ui/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3333/api
    depends_on:
      - backend
    ports:
      - '3000:3000'

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3333/api
    depends_on:
      - backend
    ports:
      - '3001:3001'

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-ui
      - admin-ui
      - backend
    ports:
      - '80:80'

volumes:
  postgres_data:
